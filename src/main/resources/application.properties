spring.application.name=gateway
server.port=8084


#eureka
eureka.client.service.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#zipkin
management.tracing.sampling.probability=1.0

# Gateway
spring.cloud.gateway.routes[0].id = companyms
spring.cloud.gateway.routes[0].uri = lb://COMPANYMS
spring.cloud.gateway.routes[0].predicates[0] = Path=/companies/**

spring.cloud.gateway.routes[1].id = jobms
spring.cloud.gateway.routes[1].uri = lb://JOBMS-DEV
spring.cloud.gateway.routes[1].predicates[0] = Path=/jobs/**

spring.cloud.gateway.routes[2].id = reviewms
spring.cloud.gateway.routes[2].uri = lb://REVIEWMS
spring.cloud.gateway.routes[2].predicates[0] = Path=/reviews/**

spring.cloud.gateway.routes[3].id = config-server
spring.cloud.gateway.routes[3].uri = http://localhost:8761
spring.cloud.gateway.routes[3].predicates[0] = Path=/eureka/main
spring.cloud.gateway.routes[3].filters[0] = SetPath=/

spring.cloud.gateway.routes[4].id = eureka-server-static
spring.cloud.gateway.routes[4].uri = http://localhost:8761
spring.cloud.gateway.routes[4].predicates[0] = Path=/eureka/**

#http://localhost:8084/eureka/main- this is the url eureka is redirected to by gateway

logging.level.root=info
logging.level.org.springframework.cloud.gateway.route.RouteDefinition=INFO
logging.level.ord.springFramework.cloud.gateway=TRACE